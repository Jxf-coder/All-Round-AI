<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1220">
  <title>修改初始密码 · All Round AI</title><link rel="stylesheet" href="login.css"><script src="change-password.js" defer></script>
</head>
<body>
  <main class="login-page">
    <div class="login-glow login-glow-top" aria-hidden="true"></div><div class="login-glow login-glow-bottom" aria-hidden="true"></div>
    <div class="login-brand-area">
      <a class="login-brand" href="/" aria-label="All Round AI 工作台"><span class="login-brand-mark">A</span><span>All Round AI</span></a>
      <p class="login-tagline">首次登录需要设置新密码</p>
    </div>
    <form class="login-form" id="change-password-form" novalidate>
      <label><span>当前密码</span><input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required></label>
      <label><span>新密码（至少 12 个字符）</span><input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="12" required></label>
      <label><span>确认新密码</span><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label>
      <p class="login-error" id="change-password-error" role="alert" aria-live="polite" hidden></p>
      <button type="submit" id="change-password-submit">保存新密码</button>
      <p class="auth-notice">新密码保存后，其他已登录会话将退出。</p>
    </form>
    <p class="login-foot">All Round AI · 本地工作台</p>
  </main>
</body>
</html>
